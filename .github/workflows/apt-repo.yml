name: Publish APT repository

# Rebuilds the whole APT repo from scratch every run -- two distributions,
# published together to the same GitHub Pages site so neither publish call
# clobbers the other (a Pages deployment replaces the entire site, so both
# distributions have to be assembled in one go regardless of which caller
# triggered this):
#
#   stable    every .deb ever attached to a non-prerelease GitHub release
#             (i.e. every tagged vX.Y.Z release) -- the full version history.
#   unstable  just the .deb attached to the single floating "unstable"
#             release (see unstable.yml), which always points at the latest
#             commit on main. Rebuilt fresh each run, so it only ever holds
#             the current build, never history.
#
# Stateless by design: no snapshot/db is carried over between runs, so
# neither distribution can drift from what's actually on the Releases page.
#
# Signed with the same GPG key already used for mnemosyne's APT repo (see
# that repo's apt-repo.yml) -- one key, one place users import from, rather
# than a separate keypair per project.
#
# One-time setup this depends on (already done for this repo):
#   - Settings > Pages > Build and deployment > Source = "GitHub Actions".
#   - The GPG signing key, with its private key and passphrase saved as the
#     APT_GPG_PRIVATE_KEY and APT_GPG_PASSPHRASE repo secrets.

on:
  workflow_call:

jobs:
  apt-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install aptly
        run: |
          version=1.6.3
          curl -fsSL "https://github.com/aptly-dev/aptly/releases/download/v${version}/aptly_${version}_linux_amd64.zip" -o aptly.zip
          unzip -q aptly.zip -d aptly-extracted
          sudo install -m 0755 "aptly-extracted/aptly_${version}_linux_amd64/aptly" /usr/local/bin/aptly
          aptly version

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent || true
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          key_id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"
          gpg --batch --yes --export "$key_id" > pubkey.gpg

      - name: Download every .deb ever released (stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs-stable
          # Excludes prereleases -- notably "unstable" (see below), which
          # gets its own distribution instead of joining this one.
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == false) | .tagName'); do
            # Older releases (before .deb packaging was added) have no matching
            # assets, which makes gh exit non-zero; skip those, not the release.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs-stable --skip-existing || true
          done
          ls -la debs-stable

      - name: Download the current unstable .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p debs-unstable
          # No "unstable" release exists yet the very first time this runs
          # (e.g. release.yml runs before unstable.yml ever has) -- leave the
          # unstable distribution empty rather than fail the whole job.
          gh release download unstable --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs-unstable --skip-existing || true
          ls -la debs-unstable

      - name: Build and publish both distributions
        env:
          GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PASSPHRASE" > /tmp/passphrase

          # -architectures=amd64 explicitly: CPACK_DEBIAN_PACKAGE_ARCHITECTURE
          # is amd64-only, but aptly normally infers the list from the
          # packages it's publishing - which fails outright on an empty
          # source (e.g. the very first stable publish, before any tagged
          # release exists yet) with "unable to figure out list of
          # architectures".
          aptly repo create -distribution=stable -component=main artisan-stable
          aptly repo add artisan-stable debs-stable
          aptly snapshot create artisan-stable-snapshot from repo artisan-stable
          aptly publish snapshot -batch -passphrase-file=/tmp/passphrase -gpg-key="$GPG_KEY_ID" -architectures=amd64 artisan-stable-snapshot

          aptly repo create -distribution=unstable -component=main artisan-unstable
          aptly repo add artisan-unstable debs-unstable
          aptly snapshot create artisan-unstable-snapshot from repo artisan-unstable
          aptly publish snapshot -batch -passphrase-file=/tmp/passphrase -gpg-key="$GPG_KEY_ID" -architectures=amd64 artisan-unstable-snapshot

          rm -f /tmp/passphrase

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp -r ~/.aptly/public/. site/
          cp pubkey.gpg site/pubkey.gpg

      # A rerun of this job doesn't replace the previous attempt's uploaded
      # "github-pages" artifact - it adds a second one alongside it under
      # the same run ID, and deploy-pages fetches artifacts by run (not by
      # attempt), so any rerun fails with "Multiple artifacts named
      # github-pages were unexpectedly found for this workflow run". There's
      # no reason to keep a previous attempt's copy around anyway - the
      # unstable distribution only ever holds the latest build - so clear it
      # out before uploading fresh.
      - name: Delete any leftover Pages artifact from a previous attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
